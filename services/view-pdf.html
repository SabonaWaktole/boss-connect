<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Museum Magazine — Boss Events</title>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;600;700;900&display=swap"
        rel="stylesheet" />
    <style>
        /* ══ ZALANDO SANS ══ */
        @font-face {
            font-family: 'ZalandoSans';
            src: url('../fonts/ZalandoSans-Regular.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: 'ZalandoSans';
            src: url('../fonts/ZalandoSans-Bold.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        ::selection {
            background: #C5A059;
            color: #000;
        }

        :root {
            --brand: #C5A059;
            --brand-dark: #A27940;
        }

        body {
            background: #1D1D1C;
            color: #fff;
            font-family: 'Onest', sans-serif;
            min-height: 100vh;
        }

        /* ── Scrollbar hide utility ── */
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        /* ══════════════════════════════════════════
       MAIN WRAPPER
       relative min-h-screen bg-[#1D1D1C] text-white flex flex-col
    ══════════════════════════════════════════ */
        .page-wrap {
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Full-page background image + gradient
       absolute inset-0 z-0
       img: object-cover opacity-20
       div: bg-linear-to-b from-[#1D1D1C]/90 via-[#1D1D1C]/80 to-[#1D1D1C]
    ── */
        .page-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        .page-bg img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            opacity: 0.20;
        }

        .page-bg-grad {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom,
                    rgba(29, 29, 28, 0.90) 0%,
                    rgba(29, 29, 28, 0.80) 50%,
                    rgba(29, 29, 28, 1.00) 100%);
        }

        /* ══════════════════════════════════════════
       SECTION 1: HERO
       relative z-10 h-[40vh] flex items-center justify-center
    ══════════════════════════════════════════ */
        .hero {
            position: relative;
            z-index: 10;
            height: 40vh;
            min-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contact.png absolute fill */
        .hero-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.50;
            display: block;
        }

        /* bg-black/60 overlay */
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.60);
        }

        /* Hero content — relative z-10 text-center px-6 */
        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 0 1.5rem;
        }

        /* Return link
       inline-flex items-center gap-2 text-[#C5A059] text-[10px] font-bold
       uppercase tracking-[0.4em] mb-4 hover:text-white transition-all */
        .return-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--brand);
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            margin-bottom: 1rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .return-link:hover {
            color: #fff;
        }

        .return-link svg {
            width: 0.875rem;
            height: 0.875rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            flex-shrink: 0;
        }

        /* h1 — text-4xl md:text-5xl font-bold tracking-tight uppercase */
        .hero-content h1 {
            font-family: 'ZalandoSans', sans-serif;
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            line-height: 1.1;
            color: #fff;
        }

        @media(min-width:768px) {
            .hero-content h1 {
                font-size: 3rem;
            }
        }

        .hero-content h1 .brand {
            color: var(--brand);
        }

        /* p — mt-4 text-white/70 max-w-xl mx-auto */
        .hero-content p {
            margin-top: 1rem;
            color: rgba(255, 255, 255, 0.70);
            max-width: 36rem;
            margin-left: auto;
            margin-right: auto;
            font-weight: 300;
            line-height: 1.65;
            font-size: 0.9375rem;
        }

        /* ══════════════════════════════════════════
       SECTION 2: MAIN CONTENT GRID
       relative z-10 max-w-[1400px] w-full mx-auto
       px-6 py-12 grid grid-cols-1 lg:grid-cols-12 gap-8
       items-start flex-1
    ══════════════════════════════════════════ */
        .content-grid {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            align-items: start;
            flex: 1;
        }

        @media(min-width:1024px) {
            .content-grid {
                grid-template-columns: 3fr 9fr;
            }
        }

        /* ── LEFT SIDEBAR — lg:col-span-3 flex flex-col gap-6 ── */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* Sidebar card — p-6 bg-black/40 backdrop-blur-md border border-white/10 rounded-sm */
        .sidebar-card {
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 2px;
        }

        /* Card heading — text-[#C5A059] font-bold text-xs uppercase tracking-widest mb-4 */
        .sidebar-card h4 {
            color: var(--brand);
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 1rem;
        }

        /* Nav buttons row — flex gap-4 */
        .nav-btns {
            display: flex;
            gap: 1rem;
            opacity: 0.20;
            pointer-events: none;
            /* locked behind paywall */
        }

        /* Each nav button
       flex-1 h-12 flex items-center justify-center
       bg-white/5 hover:bg-[#C5A059] hover:text-black
       transition-all border border-white/5 text-[#C5A059] */
        .nav-btn {
            flex: 1;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--brand);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .nav-btn:hover {
            background: var(--brand);
            color: #000;
        }

        .nav-btn svg {
            width: 1.5rem;
            height: 1.5rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Zoom row
       flex items-center bg-black/20 border border-white/5 rounded-sm */
        .zoom-row {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.20);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 2px;
            opacity: 0.20;
            pointer-events: none;
            /* locked */
        }

        /* w-12 h-12 flex items-center justify-center
       hover:bg-[#C5A059] hover:text-black transition-all */
        .zoom-btn {
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            color: #fff;
        }

        .zoom-btn:hover {
            background: var(--brand);
            color: #000;
        }

        .zoom-btn.minus {
            border-right: 1px solid rgba(255, 255, 255, 0.10);
        }

        .zoom-btn.plus {
            border-left: 1px solid rgba(255, 255, 255, 0.10);
        }

        .zoom-btn svg {
            width: 0.875rem;
            height: 0.875rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Zoom value — flex-1 text-[10px] font-bold text-center */
        .zoom-val {
            flex: 1;
            font-size: 0.625rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
        }

        /* ── RIGHT: PDF VIEWER PANEL
       lg:col-span-9 bg-black/40 border border-white/10 rounded-sm
       backdrop-blur-md shadow-2xl relative h-[70vh] md:h-[80vh]
       flex items-center justify-center overflow-hidden scrollbar-hide
    ── */
        .pdf-panel {
            background: rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 2px;
            backdrop-filter: blur(12px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
            height: 70vh;
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @media(min-width:768px) {
            .pdf-panel {
                height: 80vh;
            }
        }

        /* ── PAYWALL CARD
       w-full max-w-sm p-8 text-center
       bg-black/60 border border-white/10 rounded-sm
       backdrop-blur-lg mx-4 overflow-y-auto max-h-[90%]
    ── */
        .paywall-card {
            width: 100%;
            max-width: 24rem;
            padding: 2rem;
            text-align: center;
            background: rgba(0, 0, 0, 0.60);
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 2px;
            backdrop-filter: blur(16px);
            margin: 0 1rem;
            overflow-y: auto;
            max-height: 90%;
        }

        /* Lock icon — text-[#C5A059] flex justify-center mb-6 */
        .paywall-icon {
            color: var(--brand);
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .paywall-icon svg {
            width: 2.5rem;
            height: 2.5rem;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* h2 — text-3xl font-bold mb-2 uppercase tracking-tight */
        .paywall-card h2 {
            font-family: 'ZalandoSans', sans-serif;
            font-size: 1.875rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: -0.01em;
            color: #fff;
        }

        .paywall-card h2 .brand {
            color: var(--brand);
        }

        /* Subtitle — text-white/70 text-sm mb-6 uppercase tracking-widest font-bold */
        .paywall-sub {
            color: rgba(255, 255, 255, 0.70);
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 1.5rem;
            display: block;
        }

        /* Price — text-5xl font-bold text-white mb-8 italic */
        .paywall-price {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2rem;
            font-style: italic;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 0.25rem;
        }

        .paywall-price .currency {
            font-size: 1.125rem;
            font-style: normal;
            font-weight: 700;
            color: var(--brand);
            margin-right: 0.25rem;
        }

        /* Stripe / payment placeholder — w-full min-h-[150px] */
        .paywall-payment-area {
            width: 100%;
            min-height: 150px;
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .paywall-payment-area p {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.40);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .paywall-payment-area svg {
            width: 2rem;
            height: 2rem;
            stroke: rgba(255, 255, 255, 0.25);
            fill: none;
            stroke-width: 1.5;
        }

        /* Pay button */
        .pay-btn {
            width: 100%;
            padding: 1rem;
            background: var(--brand);
            color: #000;
            font-family: 'Onest', sans-serif;
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .pay-btn:hover {
            background: #b8923e;
        }

        /* ══════════════════════════════════════════
       SECTION 3: PAGE SLIDER
       relative z-10 max-w-[1400px] w-full mx-auto px-6 pb-20
    ══════════════════════════════════════════ */
        .slider-section {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem 5rem;
        }

        /* bg-black/40 backdrop-blur-md border border-white/10 p-8 rounded-sm
       flex flex-col md:flex-row items-center gap-8 md:gap-16 */
        .slider-card {
            background: rgba(0, 0, 0, 0.40);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.10);
            padding: 2rem;
            border-radius: 2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        @media(min-width:768px) {
            .slider-card {
                flex-direction: row;
                gap: 4rem;
            }
        }

        /* Label — min-w-[120px] text-center md:text-left */
        .slider-label {
            min-width: 120px;
            text-align: center;
        }

        @media(min-width:768px) {
            .slider-label {
                text-align: left;
            }
        }

        .slider-label .sub {
            color: var(--brand);
            font-size: 0.5625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            display: block;
            margin-bottom: 0.25rem;
        }

        .slider-label .title {
            font-size: 1.5rem;
            font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: -0.04em;
            line-height: 1;
            color: #fff;
            display: block;
        }

        /* Slider wrap — flex-1 w-full flex flex-col gap-4 */
        .slider-wrap {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            opacity: 0.20;
            pointer-events: none;
            /* locked */
        }

        /* Page info row — flex justify-between text-[10px] font-bold uppercase tracking-widest */
        .slider-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.625rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 0.25rem;
        }

        .slider-info .page-num {
            color: rgba(255, 255, 255, 0.40);
        }

        .slider-info .pct {
            color: var(--brand);
            font-style: italic;
            font-weight: 900;
        }

        /* Range input */
        input[type="range"] {
            width: 100%;
            accent-color: var(--brand);
            height: 4px;
            background: rgba(255, 255, 255, 0.10);
            border-radius: 9999px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--brand);
            cursor: pointer;
            box-shadow: 0 0 6px rgba(197, 160, 89, 0.5);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--brand);
            cursor: pointer;
            border: none;
        }

        /* ══ FOOTER ══ */
        .site-footer {
            position: relative;
            width: 100%;
            padding: 3rem 1rem;
            color: #fff;
            z-index: 10;
        }

        @media(min-width:768px) {
            .site-footer {
                padding: 3rem 2rem;
            }
        }

        .footer-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
        }

        .footer-bg img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .footer-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
        }

        .footer-inner {
            position: relative;
            z-index: 20;
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-cols {
            display: flex;
            flex-direction: column;
            gap: 3rem;
        }

        @media(min-width:768px) {
            .footer-cols {
                flex-direction: row;
                gap: 2rem;
            }
        }

        .footer-brand {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            min-width: 180px;
        }

        .footer-brand img {
            display: block;
            max-width: 180px;
        }

        .footer-brand p {
            font-size: .875rem;
            color: rgba(255, 255, 255, .60);
            max-width: 220px;
            margin-left: .5rem;
            font-weight: 300;
            line-height: 1.6;
        }

        .footer-col h3 {
            font-weight: 700;
            font-size: 1.125rem;
            margin-bottom: 1.5rem;
        }

        .footer-col ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: .75rem;
            margin-left: .25rem;
        }

        .footer-col ul li a {
            color: rgba(255, 255, 255, .70);
            font-size: .875rem;
            font-weight: 300;
            text-decoration: none;
            transition: color .2s;
        }

        .footer-col ul li a:hover {
            color: var(--brand);
        }

        .footer-connect {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-left: .25rem;
        }

        .footer-email {
            color: rgba(255, 255, 255, .70);
            font-size: .875rem;
            font-weight: 300;
            text-decoration: none;
            transition: color .2s;
        }

        .footer-email:hover {
            color: var(--brand);
        }

        .footer-socials {
            display: flex;
            gap: 1rem;
        }

        .footer-socials a {
            color: rgba(255, 255, 255, .70);
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: color .2s, transform .2s;
        }

        .footer-socials a:hover {
            color: var(--brand);
            transform: scale(1.10);
        }

        .footer-socials svg {
            width: 1.25rem;
            height: 1.25rem;
            fill: currentColor;
            stroke: currentColor;
            display: block;
        }

        .footer-bottom {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid rgba(255, 255, 255, .10);
        }

        .footer-bottom p {
            text-align: center;
            color: rgba(255, 255, 255, .50);
            font-size: .875rem;
            font-weight: 300;
        }
        .jsx-f63be5686b2d18f6 {
    width: 100%;
    min-height: 150px;
        }
    </style>
</head>

<body>

    <!-- Shared navbar injected by nav-footer.js -->

    <div class="page-wrap">

        <!-- ── Full-page background ── -->
        <div class="page-bg">
            <img src="../images/photo-1486406146926-c627a92ad1ab.avif"
                alt="Bg" />
            <div class="page-bg-grad"></div>
        </div>

        <!-- ══ SECTION 1: HERO ══ -->
        <section class="hero">
            <img class="hero-bg-img" src="../images/contact/Contact.png" alt="Hero" />
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <!-- Return link -->
                <a class="return-link" href="content.html">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                    Return
                </a>
                <h1>Museum <span class="brand">Magazine</span></h1>
                <p>Discover museums, heritage sites, and historical societies preserving our past, bringing local
                    history, culture, and community stories to life for curious readers</p>
            </div>
        </section>

        <!-- ══ SECTION 2: CONTENT GRID ══ -->
        <section class="content-grid">

            <!-- LEFT SIDEBAR -->
            <aside class="sidebar">

                <!-- Nav card -->
                <div class="sidebar-card">
                    <h4>Nav</h4>
                    <div class="nav-btns">
                        <button class="nav-btn" aria-label="Previous page">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m15 18-6-6 6-6" />
                            </svg>
                        </button>
                        <button class="nav-btn" aria-label="Next page">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="m9 18 6-6-6-6" />
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Zoom card -->
                <div class="sidebar-card">
                    <h4>Zoom</h4>
                    <div class="zoom-row">
                        <button class="zoom-btn minus" aria-label="Zoom out">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M5 12h14" />
                            </svg>
                        </button>
                        <span class="zoom-val">100%</span>
                        <button class="zoom-btn plus" aria-label="Zoom in">
                            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M5 12h14" />
                                <path d="M12 5v14" />
                            </svg>
                        </button>
                    </div>
                </div>

            </aside>

            <!-- RIGHT: PDF VIEWER PANEL -->
